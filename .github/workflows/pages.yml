name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  firmware:
    name: Firmware
    uses: ./.github/workflows/firmware.yml

  decoder-tests:
    name: Decoder-Hosttests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S firmware/components/its/test -B build-test
      - run: cmake --build build-test
      - run: ctest --test-dir build-test --output-on-failure
      - run: make -C firmware/main/test_battery clean test

  site:
    name: Seite zusammenstellen
    needs: [firmware, decoder-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out

      - name: Seite zusammenstellen
        run: |
          set -eu
          mkdir -p _site/firmware _site/gehaeuse
          cp -r web/. _site/
          cp out/firmware-factory.bin _site/firmware/
          # Druckdateien aller Varianten flach nach gehaeuse/, mit Variantenpraefix (lipo_*, lifepo4_*, usb_*)
          for v in lipo lifepo4 usb; do
            for f in enclosure/export/$v/*.3mf enclosure/export/$v/*.step enclosure/export/$v/*.stl; do
              [ -e "$f" ] && cp "$f" "_site/gehaeuse/${v}_$(basename "$f")" || true
            done
            # 3D-Viewer: GLB-Modelle + Vorschaubilder je Variante (nicht in files.json)
            if [ -d enclosure/export/$v/glb ]; then
              mkdir -p _site/gehaeuse/3d/$v
              cp -r enclosure/export/$v/glb/. _site/gehaeuse/3d/$v/
            fi
          done
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
          python3 - "$VERSION" <<'PY'
          import json, sys
          manifest = {
              "name": "ITS-G5 Empfänger (ESP32-C5-LCD-2.73)",
              "version": sys.argv[1],
              "new_install_prompt_erase": True,
              "builds": [
                  {
                      "chipFamily": "ESP32-C5",
                      "parts": [{"path": "firmware/firmware-factory.bin", "offset": 0}],
                  }
              ],
          }
          with open("_site/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)
          PY
          rm -f _site/gehaeuse/*_board_dummy.* _site/gehaeuse/*_cell_dummy.* _site/gehaeuse/*_charger_dummy.*
          (cd _site/gehaeuse && python3 -c "import json,os; print(json.dumps(sorted(f for f in os.listdir('.') if f.endswith(('.3mf','.step','.stl')) and '_assembly' not in f)))" > files.json)
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Eigener Job (wie im offiziellen Pages-Starter-Workflow): deploy-pages direkt im selben Job
  # wie upload-pages-artifact fand das Artefakt sporadisch nicht ("No artifacts named github-pages").
  deploy:
    name: Web-Flasher veroeffentlichen
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
