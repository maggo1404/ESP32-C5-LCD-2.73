name: Firmware (wiederverwendbar)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware bauen (ESP-IDF v5.5.6, esp32c5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: firmware/managed_components
          key: managed-components-${{ hashFiles('firmware/main/idf_component.yml') }}

      # Der Befehl laeuft im Container espressif/idf:v5.5.6 (IDF-Umgebung ist geladen).
      # esptool 4.x (IDF v5.5) kennt `merge_bin`; esptool 5.x akzeptiert den alten Namen
      # weiterhin als Alias (mit Hinweis), daher funktioniert der Aufruf in beiden Versionen.
      - name: Bauen und Factory-Image erzeugen
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c5
          path: firmware
          command: >-
            idf.py build &&
            cd build &&
            python -m esptool --chip esp32c5 merge_bin
            -o firmware-factory.bin
            --flash_mode dio --flash_freq 80m --flash_size 32MB
            @flash_args

      - name: Artefakte zusammenstellen
        run: |
          set -eu
          mkdir -p out
          cp firmware/build/firmware-factory.bin out/
          cp firmware/build/flash_args out/
          cp firmware/build/bootloader/bootloader.bin out/
          cp firmware/build/partition_table/partition-table.bin out/
          # Anwendungs-Image: alle .bin im Build-Wurzelverzeichnis ausser dem Factory-Image
          for f in firmware/build/*.bin; do
            [ "$(basename "$f")" = firmware-factory.bin ] || cp "$f" out/
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/
          if-no-files-found: error
