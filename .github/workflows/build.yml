name: Build

on:
  push:
    branches-ignore: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  decoder-tests:
    name: Decoder-Hosttests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren
        run: cmake -S firmware/components/its/test -B build-test
      - name: Bauen
        run: cmake --build build-test
      - name: Testen
        run: ctest --test-dir build-test --output-on-failure

  firmware:
    name: Firmware
    uses: ./.github/workflows/firmware.yml

  release:
    name: GitHub-Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [decoder-tests, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out
      - name: Release mit Firmware
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/firmware-factory.bin
      - name: Gehaeuse-Dateien auswaehlen
        run: |
          set -eu
          mkdir -p enclosure-release
          for f in enclosure/export/*.step enclosure/export/*.stl enclosure/export/*.3mf; do
            case "$(basename "$f")" in board_dummy.*) continue;; esac
            [ -e "$f" ] && cp "$f" enclosure-release/ || true
          done
      - name: Gehaeuse-Dateien anhaengen
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            enclosure-release/*
